name: Windows native builds

on:
  pull_request:
    paths:
      - .github/workflows/windows-native.yml
      - .github/desktop-build.json
      - src-tauri/**
      - src/**
      - package.json
      - pnpm-lock.yaml
  push:
    branches:
      - develop
      - main
      - 'codex/windows-native-ci'
    paths:
      - .github/workflows/windows-native.yml
      - .github/desktop-build.json
      - src-tauri/**
      - src/**
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 / ${{ matrix.variant }}
    runs-on: windows-2022
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          path: castglean
          persist-credentials: false
      - name: Read build pins
        id: pins
        shell: pwsh
        run: |
          $pins = Get-Content castglean/.github/desktop-build.json -Raw | ConvertFrom-Json
          if ($pins.talechime -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid TaleChime SHA' }
          foreach ($key in 'talechime', 'node', 'pnpm', 'rust', 'cuda', 'cuda_cap') {
            "$key=$($pins.$key)" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          repository: yexiyue/talechime
          ref: ${{ steps.pins.outputs.talechime }}
          path: talechime
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
          package-manager-cache: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install CUDA Toolkit
        if: matrix.variant == 'cuda'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ steps.pins.outputs.cuda }}
          method: local
          sub-packages: '["nvcc","crt","nvvm","nvptxcompiler","cudart","cudart_dev","cublas","cublas_dev","curand","curand_dev","nvrtc","nvrtc_dev","thrust"]'
      - name: Build native desktop executable
        working-directory: castglean
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.pins.outputs.rust }}
          PNPM_VERSION: ${{ steps.pins.outputs.pnpm }}
          TALECHIME_SHA: ${{ steps.pins.outputs.talechime }}
          VARIANT: ${{ matrix.variant }}
          CUDA_COMPUTE_CAP: ${{ steps.pins.outputs.cuda_cap }}
        run: |
          if ((git -C ../talechime rev-parse HEAD) -ne $env:TALECHIME_SHA) { throw 'TaleChime checkout mismatch' }
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm install --global "pnpm@$env:PNPM_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $build = @('exec', 'tauri', 'build', '--target', 'x86_64-pc-windows-msvc', '--no-bundle')
          if ($env:VARIANT -eq 'cuda') {
            nvcc --version
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $build += @('--features', 'windows-cuda')
          }
          $build += @('--', '--locked')
          pnpm.cmd @build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Test-Path src-tauri/target/x86_64-pc-windows-msvc/release/castglean.exe)) { throw 'Native executable missing' }
