[package]
name = "castglean"
version = "0.1.0"
description = "CastGlean desktop audiobook studio"
authors = ["yexiyue"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "castglean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 专用原生命中测试；不注入标题栏或启用全局 Tauri API。
tauri-plugin-snap-layout = "=1.0.9"
sha2 = "0.10"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 三者必须同源配套：tauri-specta rc.26 内部锁定 specta rc.26 与
# specta-typescript 0.0.13，直接依赖版本不一致会出现双版本并存，
# `#[specta::specta]` 派生与 `export(Typescript)` 的类型对不上。
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript", "derive"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
fs2 = "0.4"
anyhow = "1"
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
# 引擎 future 非 Send（内部 Rc）；宿主用 LocalSet 在 Send 任务内驱动。
tokio = { version = "1", features = ["sync", "time", "macros"] }
graph-flow = { version = "=0.8.1", default-features = false }
rig-core = { version = "=0.46.0", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "=0.46.0", default-features = false }
rig-reqwest = { version = "=0.46.0", default-features = false, features = ["rustls"] }
schemars = "1"
keyring = "=4.2.0"
encoding_rs = "0.8"
regex = "1"
async-trait = "0.1"
thiserror = "2"
url = "2"
futures-util = "0.3"
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "with-json", "sqlx-sqlite", "runtime-tokio", "schema-sync", "entity-registry"] }
apalis = { version = "=1.0.0", default-features = false, features = ["task-context", "limit"] }
apalis-sqlite = { version = "=1.0.0", default-features = false, features = ["tokio-comp", "migrate", "json"] }
tokio-util = "0.7"
# Explicit CPU backends on every platform; Metal stays target-scoped.
talechime = { path = "../../talechime/crates/talechime", default-features = false, features = [
    "moss-nano-candle", "moss-candle", "kokoro", "qwen", "indextts", "cosyvoice3", "voxcpm", "omnivoice",
] }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry", "env-filter", "tracing-log", "ansi"] }
tracing-appender = "0.2.5"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
talechime = { path = "../../talechime/crates/talechime", default-features = false, features = [
    "moss-nano-candle-metal", "moss-candle-metal", "kokoro-metal", "qwen-metal", "indextts-metal", "cosyvoice3-metal", "voxcpm-metal", "omnivoice-metal",
] }

# 与 talechime workspace 的 patch 保持一致：[patch.crates-io] 跨 workspace
# 不传递，宿主必须重复声明 candle fork，否则会错误地解析到 crates.io 官方
# 0.11.0 而不是 talechime 依赖的 fork（见 talechime/Cargo.toml 与其
# docs/legal/candle/SOURCE.md）。
[patch.crates-io]
candle-core = { git = "https://github.com/yexiyue/candle", rev = "884b359895a16c8fbd3647789b1f7c7974894708", package = "candle-core" }
candle-nn = { git = "https://github.com/yexiyue/candle", rev = "884b359895a16c8fbd3647789b1f7c7974894708", package = "candle-nn" }
candle-transformers = { git = "https://github.com/yexiyue/candle", rev = "884b359895a16c8fbd3647789b1f7c7974894708", package = "candle-transformers" }
candle-metal-kernels = { git = "https://github.com/yexiyue/candle", rev = "884b359895a16c8fbd3647789b1f7c7974894708", package = "candle-metal-kernels" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
