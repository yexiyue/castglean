[package]
name = "castglean"
version = "0.1.0"
description = "CastGlean desktop audiobook studio"
authors = ["yexiyue"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "castglean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 三者必须同源配套：tauri-specta rc.26 内部锁定 specta rc.26 与
# specta-typescript 0.0.13，直接依赖版本不一致会出现双版本并存，
# `#[specta::specta]` 派生与 `export(Typescript)` 的类型对不上。
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript", "derive"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
